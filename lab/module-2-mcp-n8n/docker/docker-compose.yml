# Self-hosted n8n for the lab, run locally by each participant.
#
# Usage:
#   1. cp .env.example .env   and fill in real values (see README.md)
#   2. docker compose up -d
#   3. open http://localhost:5678
#
# Reset between cohorts / to wipe workflows+credentials: docker compose down -v

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: qam-n8n-lab
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Auth is n8n's own owner-account setup screen (email + password),
      # shown on first UI load — there is no working basic-auth env var in
      # current n8n versions, so none is set here. See docker/README.md.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env - see .env.example for how to generate one}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Kolkata}
      - TZ=${GENERIC_TIMEZONE:-Asia/Kolkata}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:

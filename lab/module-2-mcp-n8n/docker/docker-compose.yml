# Self-hosted n8n for the lab, run locally by each participant.
#
# Usage:
#   1. cp .env.example .env   and fill in real values (see README.md)
#   2. docker compose up -d
#   3. open http://localhost:5678
#
# Reset between cohorts / to wipe workflows+credentials: docker compose down -v

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: qam-n8n-lab
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Auth is n8n's own owner-account setup screen (email + password),
      # shown on first UI load — there is no working basic-auth env var in
      # current n8n versions, so none is set here. See docker/README.md.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env - see .env.example for how to generate one}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Kolkata}
      - TZ=${GENERIC_TIMEZONE:-Asia/Kolkata}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n

  # Splunk, for the client demo only — not part of any lab exercise.
  # Ships as a full 60-day Splunk Enterprise Trial by default (that's what
  # --accept-license alone gives you); Splunk auto-converts an unused trial
  # to the perpetual, single-instance Free license (500MB/day) after 60
  # days with no extra config needed — plenty for a demo container that
  # isn't meant to run that long anyway. See splunk-demo.md.
  splunk:
    image: splunk/splunk:latest
    container_name: qam-splunk-demo
    restart: unless-stopped
    ports:
      - "8001:8000"   # Splunk Web — host port 8001, NOT 8000 (commonly occupied by other
                       # local projects; container-internal port stays 8000, nothing inside
                       # Splunk needs to know about the remap)
      - "8088:8088"   # HTTP Event Collector (HEC) — token created via Web UI, see splunk-demo.md
      - "8089:8089"   # Management/REST API
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:?set SPLUNK_PASSWORD in .env - 8+ chars, at least 1 uppercase and 1 digit}
    volumes:
      - splunk_var:/opt/splunk/var
      - splunk_etc:/opt/splunk/etc

volumes:
  n8n_data:
  splunk_var:
  splunk_etc:
